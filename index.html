<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SyncSkill Pickles | Authentic Taste</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        /* ========== PREMIUM CSS VARIABLES ========== */
        :root {
            --brand-primary: #032E2E;
            --brand-hover: #002726;
            --brand-light: #e6eded;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --border-light: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
            --shadow-hover: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --radius-md: 16px; 
            --radius-lg: 24px;
            --max-width: 1280px;
            --transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'IBM Plex Sans', sans-serif; }
        body { background: var(--bg-main); color: var(--text-main); overflow-x: hidden; -webkit-font-smoothing: antialiased; }
        a { text-decoration: none; color: inherit; }
        button { cursor: pointer; border: none; background: none; font-family: inherit; }

        /* ========== NAVBAR ========== */
        .navbar { position: fixed; top: 0; width: 100%; height: 72px; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border-light); z-index: 1000; display: flex; align-items: center; }
        .nav-container { max-width: var(--max-width); width: 100%; margin: 0 auto; padding: 0 24px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 20px; font-weight: 700; color: var(--brand-primary); display: flex; align-items: center; gap: 8px; letter-spacing: -0.5px; }
        .nav-actions { display: flex; gap: 20px; align-items: center; color: var(--text-main); font-size: 20px; }
        .cart-icon { position: relative; cursor: pointer; transition: color 0.2s; }
        .cart-icon:hover { color: var(--brand-primary); }
        .cart-badge { position: absolute; top: -6px; right: -8px; background: #ef4444; color: white; font-size: 10px; font-weight: 700; width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }

        .container { max-width: var(--max-width); margin: 0 auto; padding: 0 24px; }
        .section-title { font-size: 28px; font-weight: 700; margin-bottom: 32px; color: var(--text-main); display: flex; align-items: center; gap: 12px; letter-spacing: -0.5px; }
        .section-spacer { padding: 60px 0; }

        /* ========== HERO SLIDER ========== */
        .hero-slider { margin-top: 72px; width: 100%; height: 500px; position: relative; background: #e2e8f0; overflow: hidden; display: none; }
        .slide { position: absolute; inset: 0; opacity: 0; transition: opacity 0.8s ease-in-out; display: flex; align-items: center; justify-content: center; }
        .slide.active { opacity: 1; z-index: 2; }
        .slide-img { width: 100%; height: 100%; object-fit: cover; position: absolute; z-index: 1; filter: brightness(0.85); }
        .slide-content { position: relative; z-index: 3; text-align: center; color: white; padding: 0 24px; max-width: 800px; }
        .slide-btn { display: inline-block; padding: 16px 36px; background: white; color: var(--brand-primary); font-weight: 600; font-size: 16px; border-radius: var(--radius-md); box-shadow: 0 10px 25px rgba(0,0,0,0.15); margin-top: 24px; transition: var(--transition); letter-spacing: 0.5px; }
        .slide-btn:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(0,0,0,0.2); background: var(--bg-main); }
        
        .slider-arrow { position: absolute; top: 50%; transform: translateY(-50%); z-index: 4; background: rgba(255,255,255,0.2); color: white; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; backdrop-filter: blur(8px); transition: var(--transition); border: 1px solid rgba(255,255,255,0.3); }
        .slider-arrow:hover { background: rgba(255,255,255,0.4); transform: translateY(-50%) scale(1.05); }
        .arrow-left { left: 30px; }
        .arrow-right { right: 30px; }

        /* ========== PRODUCT CARDS ========== */
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 32px; }
        .product-card { background: var(--bg-card); border: 1px solid var(--border-light); border-radius: var(--radius-lg); overflow: hidden; transition: var(--transition); position: relative; display: flex; flex-direction: column; cursor: pointer; }
        .product-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-hover); border-color: rgba(3, 46, 46, 0.15); }
        .product-img-wrapper { width: 100%; aspect-ratio: 4/3; position: relative; overflow: hidden; background: #f1f5f9; }
        .product-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1); }
        .product-card:hover .product-img { transform: scale(1.06); }
        .product-info { padding: 24px; display: flex; flex-direction: column; flex: 1; }
        .product-card-title { font-size: 18px; font-weight: 600; color: var(--text-main); margin-bottom: 8px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .product-card-price { font-size: 20px; font-weight: 700; color: var(--brand-primary); margin-top: auto; display: flex; align-items: center; justify-content: space-between; }
        .view-btn { background: var(--brand-light); color: var(--brand-primary); width: 40px; height: 40px; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; transition: var(--transition); }
        .product-card:hover .view-btn { background: var(--brand-primary); color: white; transform: scale(1.05); }

        /* ========== COMBO OFFER ========== */
        .combo-container { background: linear-gradient(145deg, #ffffff 0%, var(--brand-light) 100%); border: 1px solid rgba(3, 46, 46, 0.1); border-radius: 24px; padding: 40px; margin: 20px 0; box-shadow: var(--shadow-md); position: relative; overflow: hidden; }
        .combo-container::before { content: ''; position: absolute; top: 0; right: 0; width: 300px; height: 300px; background: radial-gradient(circle, rgba(3,46,46,0.05) 0%, transparent 70%); transform: translate(30%, -30%); pointer-events: none; }
        .combo-header-meta { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 24px; margin-bottom: 32px; position: relative; z-index: 2; }
        .combo-title { font-size: 28px; font-weight: 700; color: var(--text-main); letter-spacing: -0.5px; }
        .combo-badge { background: var(--text-main); color: white; padding: 6px 16px; border-radius: var(--radius-md); font-size: 13px; font-weight: 600; margin-top: 8px; display: inline-block; letter-spacing: 0.5px; text-transform: uppercase; }
        .combo-price-action { display: flex; align-items: center; gap: 24px; background: white; padding: 12px 24px; border-radius: var(--radius-md); box-shadow: var(--shadow-sm); border: 1px solid var(--border-light); }
        .combo-total-price { font-size: 24px; font-weight: 700; color: var(--brand-primary); }
        
        .combo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; position: relative; z-index: 2; }
        .combo-card { background: white; border: 2px solid var(--border-light); border-radius: var(--radius-md); padding: 12px; display: flex; align-items: center; gap: 16px; cursor: pointer; transition: var(--transition); user-select: none; box-shadow: var(--shadow-sm); }
        .combo-card:hover { border-color: rgba(3, 46, 46, 0.3); transform: translateY(-2px); }
        .combo-card.selected { border-color: var(--brand-primary); background: #ffffff; box-shadow: 0 8px 15px rgba(3,46,46,0.08); }
        .combo-card img { width: 60px; height: 60px; border-radius: 10px; object-fit: cover; }
        .combo-card-name { font-size: 14px; font-weight: 600; color: var(--text-main); flex: 1; line-height: 1.3; }
        .checkbox-ui { width: 24px; height: 24px; border-radius: 6px; border: 2px solid #cbd5e1; display: flex; align-items: center; justify-content: center; font-size: 12px; color: transparent; transition: var(--transition); background: white; }
        .combo-card.selected .checkbox-ui { background: var(--brand-primary); border-color: var(--brand-primary); color: white; }
        
        .buy-combo-btn { background: var(--brand-primary); color: white; padding: 14px 32px; border-radius: var(--radius-md); font-weight: 600; font-size: 16px; display: inline-flex; align-items: center; gap: 10px; transition: var(--transition); box-shadow: 0 4px 14px rgba(3,46,46,0.2); }
        .buy-combo-btn:hover:not(:disabled) { background: var(--brand-hover); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(3,46,46,0.3); }
        .buy-combo-btn:disabled { background: #cbd5e1; box-shadow: none; cursor: not-allowed; }

        /* ========== CATEGORIES NAVIGATION ========== */
        .category-scroll { display: flex; gap: 32px; overflow-x: auto; padding: 10px 5px 20px; scrollbar-width: none; -ms-overflow-style: none; }
        .category-scroll::-webkit-scrollbar { display: none; }
        .category-circle-item { display: flex; flex-direction: column; align-items: center; gap: 16px; min-width: 110px; cursor: pointer; }
        .category-circle { width: 110px; height: 110px; border-radius: 50%; border: 3px solid transparent; overflow: hidden; background: white; transition: var(--transition); box-shadow: var(--shadow-md); padding: 4px; }
        .category-circle-item:hover .category-circle { border-color: var(--brand-primary); transform: translateY(-4px); box-shadow: var(--shadow-lg); }
        .category-circle img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
        .category-name { font-size: 15px; font-weight: 600; text-align: center; color: var(--text-main); transition: color 0.2s; }
        .category-circle-item:hover .category-name { color: var(--brand-primary); }

        /* ========== PROMO POPUP ========== */
        .promo-popup-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(6px); z-index: 9999; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.4s ease; }
        .promo-popup-overlay.show { opacity: 1; pointer-events: auto; }
        .promo-popup { background: var(--bg-card); width: 90%; max-width: 440px; border-radius: var(--radius-lg); position: relative; overflow: hidden; transform: translateY(20px) scale(0.95); transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); display: flex; flex-direction: column; border: 1px solid rgba(255,255,255,0.2); }
        .promo-popup-overlay.show .promo-popup { transform: translateY(0) scale(1); }
        .promo-close { position: absolute; top: 16px; right: 16px; width: 32px; height: 32px; background: rgba(255,255,255,0.95); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; z-index: 10; color: var(--text-main); font-size: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); transition: all 0.2s; }
        .promo-close:hover { background: white; color: #ef4444; transform: scale(1.1); }
        .promo-img { width: 100%; height: auto; max-height: 280px; object-fit: cover; display: none; }
        .promo-content { padding: 32px 24px; text-align: center; }
        .promo-title { font-size: 24px; font-weight: 700; color: var(--text-main); margin-bottom: 12px; line-height: 1.2; letter-spacing: -0.5px; }
        .promo-message { font-size: 15px; color: var(--text-sub); margin-bottom: 24px; line-height: 1.5; }
        .promo-btn { display: inline-flex; align-items: center; justify-content: center; width: 100%; padding: 14px 24px; background: var(--brand-primary); color: white; border-radius: var(--radius-md); font-weight: 600; font-size: 16px; transition: var(--transition); letter-spacing: 0.5px;}
        .promo-btn:hover { background: var(--brand-hover); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(3, 46, 46, 0.2); }

        /* ========== FOOTER ========== */
        footer { background: white; border-top: 1px solid var(--border-light); padding: 40px 24px; text-align: center; margin-top: 40px; color: var(--text-sub); }
        .footer-logo { font-size: 24px; font-weight: 700; color: var(--text-main); margin-bottom: 16px; letter-spacing: -0.5px; }

        /* ========== UTILITIES ========== */
        .loading-shimmer { text-align: center; padding: 60px 0; color: var(--text-sub); font-size: 16px; font-weight: 500; animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }

        @media (max-width: 768px) {
            .hero-slider { height: 380px; }
            .slide-btn { padding: 12px 28px; font-size: 14px; }
            .slider-arrow { width: 40px; height: 40px; font-size: 16px; }
            .arrow-left { left: 16px; }
            .arrow-right { right: 16px; }
            .combo-container { padding: 24px; border-radius: 20px; }
            .combo-header-meta { flex-direction: column; align-items: flex-start; gap: 16px; }
            .combo-price-action { width: 100%; justify-content: space-between; padding: 8px 16px; border-radius: var(--radius-md); }
            .buy-combo-btn { padding: 12px 20px; font-size: 14px; }
            .category-circle { width: 90px; height: 90px; }
            .category-circle-item { min-width: 90px; }
            .section-title { font-size: 24px; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <i class="fas fa-pepper-hot"></i> SyncSkill Pickles
            </a>
            <div class="nav-actions">
                <div class="cart-icon" onclick="window.location.href='checkout.html'">
                    <i class="fas fa-shopping-cart"></i>
                    <div class="cart-badge" id="cart-count">0</div>
                </div>
            </div>
        </div>
    </nav>

    <section class="hero-slider" id="hero-slider-wrapper">
        <div id="slides-container"></div>
        <button class="slider-arrow arrow-left" onclick="moveSlide(-1)"><i class="fas fa-chevron-left"></i></button>
        <button class="slider-arrow arrow-right" onclick="moveSlide(1)"><i class="fas fa-chevron-right"></i></button>
    </section>

    <main class="container">
        
        <section class="section-spacer">
            <h2 class="section-title"><i class="fas fa-fire" style="color: #ef4444;"></i> Top Selling Pickles</h2>
            <div class="product-grid" id="top-selling-container">
                <div class="loading-shimmer">Loading top selling products...</div>
            </div>
        </section>

        <section id="combo-offer-section" style="display: none;">
            <div class="combo-container">
                <div class="combo-header-meta">
                    <div>
                        <h2 class="combo-title" id="combo-display-name">Loading Combo...</h2>
                        <span class="combo-badge">Pick Exactly 4 Pickles</span>
                    </div>
                    <div class="combo-price-action">
                        <div class="combo-total-price" id="combo-display-price">₹0</div>
                        <button id="buy-combo-btn" class="buy-combo-btn" disabled onclick="app.checkoutCombo()">
                            <i class="fas fa-shopping-basket"></i> Buy Combo Pack
                        </button>
                    </div>
                </div>
                <div id="combo-selection-grid" class="combo-grid"></div>
            </div>
        </section>

        <section class="section-spacer" style="padding-bottom: 20px;">
            <h2 class="section-title">Browse Categories</h2>
            <div class="category-scroll" id="category-circles-container"></div>
        </section>

        <div id="master-categories-block"></div>

    </main>

    <footer>
        <div class="footer-logo"><i class="fas fa-pepper-hot" style="color: var(--brand-primary);"></i> SyncSkill Pickles</div>
        <p>&copy; 2026 SyncSkill Pickles. All rights reserved.</p>
    </footer>

    <div class="promo-popup-overlay" id="promo-popup-overlay">
        <div class="promo-popup">
            <button class="promo-close" onclick="app.closePromoPopup()">
                <i class="fas fa-times"></i>
            </button>
            <img src="" id="promo-img" class="promo-img" alt="Promo Offer">
            <div class="promo-content" id="promo-content-wrapper">
                <h2 class="promo-title" id="promo-title"></h2>
                <p class="promo-message" id="promo-message"></p>
                <a href="#" class="promo-btn" id="promo-btn"></a>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // IMPORTANT: Replace with your actual credentials
        const firebaseConfig = {
            apiKey: "AIzaSyCZbCr-Zt5KQblRQ8Pk58KuinCVP-TlXGo",
            authDomain: "happynonvegpickles-f2636.firebaseapp.com",
            projectId: "happynonvegpickles-f2636",
            storageBucket: "happynonvegpickles-f2636.firebasestorage.app",
            messagingSenderId: "802823212924",
            appId: "1:802823212924:web:d82c92737ffa950798def9"
        };

        const db = getFirestore(initializeApp(firebaseConfig));
        const MASTER_DOC_REF = doc(db, 'landing_page', 'master');

        // Slider Navigation Setup
        window.currentSlideIndex = 0;
        window.moveSlide = (direction) => {
            const slides = document.querySelectorAll('.slide');
            if (slides.length === 0) return;
            slides[window.currentSlideIndex].classList.remove('active');
            window.currentSlideIndex = (window.currentSlideIndex + direction + slides.length) % slides.length;
            slides[window.currentSlideIndex].classList.add('active');
        };

        window.app = {
            runtimeProductsMap: {}, 
            activeComboData: null,
            selectedComboItems: [],

            init: async () => {
                try {
                    // Update Cart Badge on load
                    window.app.updateCartCount();

                    // Fetch configurations and combos parallelly
                    const [masterSnap, combosCollectionSnap] = await Promise.all([
                        getDoc(MASTER_DOC_REF),
                        getDocs(collection(db, 'combos'))
                    ]);

                    if (!masterSnap.exists()) {
                        console.warn("Master document missing.");
                        return;
                    }

                    const masterData = masterSnap.data();
                    const config = masterData.config || {};

                    // --- PROMOTIONAL POPUP TRIGGER ---
                    if (masterData.popup_config && masterData.popup_config.isEnabled) {
                        window.app.handlePromoPopup(masterData.popup_config);
                    }

                    // 1. Render Hero Slider
                    if (masterData.hero_slides && config.isHeroEnabled !== false) {
                        window.app.renderHeroSlider(masterData.hero_slides.slides || []);
                    }

                    // Extract layout & fetch individual category documents
                    const activeCategoriesList = config.categories || [];
                    const categoryIdsToFetch = activeCategoriesList.filter(c => c.isVisible).map(c => c.id);
                    
                    const categoryDocsArray = await Promise.all(
                        categoryIdsToFetch.map(catId => getDoc(doc(db, 'categories', catId)))
                    );

                    const operationalCategories = [];
                    
                    // --- DATA SANITIZATION LOGIC ---
                    categoryDocsArray.forEach(snap => {
                        if (snap.exists()) {
                            const catData = snap.data();
                            
                            // Check 1: Ensure entire Category is strictly available
                            if (catData.isavailable !== false) {
                                
                                const activeProductsMap = {};
                                
                                // Check 2: Filter out unavailable products from the category map
                                if (catData.products) {
                                    Object.values(catData.products).forEach(prod => {
                                        if (prod.isavailable !== false) {
                                            activeProductsMap[prod.id] = prod;
                                            // Sync only active products to global map for Top Selling
                                            window.app.runtimeProductsMap[prod.id] = prod; 
                                        }
                                    });
                                }

                                operationalCategories.push({ 
                                    id: snap.id, 
                                    ...catData, 
                                    products: activeProductsMap // Inject sanitized map back
                                });
                            }
                        }
                    });

                    // 2. Render Top Selling (will automatically hide unavailable products due to sanitization above)
                    window.app.renderTopSellingSection(config.bestPickles || []);

                    // 3. Render Combo Offer
                    window.app.renderActiveComboBlock(combosCollectionSnap);

                    // 4. Render Category Circles (will hide unavailable categories)
                    window.app.renderCategoryCircles(operationalCategories);

                    // 5. Render Products Grouped By Category
                    window.app.renderCategorizedCatalogGrid(categoryIdsToFetch, operationalCategories);

                } catch (err) {
                    console.error("Initialization Error:", err);
                    document.getElementById('top-selling-container').innerHTML = `<div class="loading-shimmer">Failed to load store data. Please try again.</div>`;
                }
            },

            // ================= POPUP LOGIC =================
            handlePromoPopup: (config) => {
                const freq = config.frequency || 'session';
                const popupKey = 'syncskill_popup_seen';
                
                // Frequency Checks
                if (freq === 'session') {
                    if (sessionStorage.getItem(popupKey)) return; 
                } else if (freq === 'daily') {
                    const lastSeen = localStorage.getItem(popupKey);
                    if (lastSeen) {
                        const daysPassed = (Date.now() - parseInt(lastSeen)) / (1000 * 60 * 60 * 24);
                        if (daysPassed < 1) return; 
                    }
                }

                // Populate Content
                const imgEl = document.getElementById('promo-img');
                const contentWrapper = document.getElementById('promo-content-wrapper');
                
                if (config.image) {
                    imgEl.src = config.image;
                    imgEl.style.display = 'block';
                } else {
                    imgEl.style.display = 'none';
                }
                
                // If it's purely an image flyer, hide the text/button wrapper
                if (!config.title && !config.message && !config.btnText) {
                    contentWrapper.style.display = 'none';
                } else {
                    document.getElementById('promo-title').innerText = config.title || '';
                    document.getElementById('promo-message').innerText = config.message || '';
                    
                    const btnEl = document.getElementById('promo-btn');
                    if (config.btnText) {
                        btnEl.innerText = config.btnText;
                        btnEl.href = config.btnLink || '#';
                        btnEl.style.display = 'inline-flex';
                    } else {
                        btnEl.style.display = 'none';
                    }
                }

                // Apply Delay and Show
                const delayMs = (config.delay || 0) * 1000;
                setTimeout(() => {
                    document.getElementById('promo-popup-overlay').classList.add('show');
                }, delayMs);
            },

            closePromoPopup: () => {
                document.getElementById('promo-popup-overlay').classList.remove('show');
                // Record that the user has seen it to respect the frequency settings
                sessionStorage.setItem('syncskill_popup_seen', 'true');
                localStorage.setItem('syncskill_popup_seen', Date.now().toString());
            },

            // ================= RENDERING LOGIC =================
            renderHeroSlider: (slides) => {
                const activeSlides = slides.filter(s => s.isActive);
                if (activeSlides.length === 0) return;

                const container = document.getElementById('slides-container');
                const isMobile = window.innerWidth <= 768;

                container.innerHTML = activeSlides.map((slide, idx) => `
                    <div class="slide ${idx === 0 ? 'active' : ''}">
                        <img src="${isMobile ? slide.mobileImg : slide.desktopImg}" class="slide-img" alt="Banner">
                        ${slide.btnName ? `
                            <div class="slide-content">
                                <a href="${slide.btnLink || '#'}" class="slide-btn">${slide.btnName}</a>
                            </div>
                        ` : ''}
                    </div>
                `).join('');

                document.getElementById('hero-slider-wrapper').style.display = 'block';
                setInterval(() => window.moveSlide(1), 5000);
            },

            renderTopSellingSection: (bestPickleIds) => {
                const container = document.getElementById('top-selling-container');
                const validItems = bestPickleIds.map(id => window.app.runtimeProductsMap[id]).filter(Boolean);

                if (validItems.length === 0) {
                    container.innerHTML = `<div class="loading-shimmer">More amazing products coming soon!</div>`;
                    return;
                }

                container.innerHTML = validItems.map(prod => `
                    <div class="product-card" onclick="window.location.href='view.html?id=${prod.id}'">
                        <div class="product-img-wrapper">
                            <img src="${prod.image}" class="product-img" alt="${prod.name}">
                        </div>
                        <div class="product-info">
                            <h4 class="product-card-title">${prod.name}</h4>
                            <div class="product-card-price">
                                <span>₹${prod.minPrice}</span>
                                <div class="view-btn"><i class="fas fa-arrow-right"></i></div>
                            </div>
                        </div>
                    </div>
                `).join('');
            },

            renderActiveComboBlock: (combosSnap) => {
                const activeComboDoc = combosSnap.docs.map(d => d.data()).find(c => c.isActive === true);
                if (!activeComboDoc) return;

                window.app.activeComboData = activeComboDoc;
                document.getElementById('combo-display-name').innerText = activeComboDoc.name;
                document.getElementById('combo-display-price').innerText = `₹${activeComboDoc.price}`;

                const grid = document.getElementById('combo-selection-grid');
                grid.innerHTML = (activeComboDoc.items || []).map(item => `
                    <div class="combo-card" id="combo-item-${item.id}" onclick="window.app.handleComboSelection('${item.id}', '${item.name.replace(/'/g, "\\'")}')">
                        <img src="${item.image}" alt="${item.name}">
                        <span class="combo-card-name">${item.name}</span>
                        <div class="checkbox-ui"><i class="fas fa-check"></i></div>
                    </div>
                `).join('');

                document.getElementById('combo-offer-section').style.display = 'block';
            },

            handleComboSelection: (id, name) => {
                const card = document.getElementById(`combo-item-${id}`);
                const isAlreadySelected = window.app.selectedComboItems.some(i => i.id === id);

                if (isAlreadySelected) {
                    window.app.selectedComboItems = window.app.selectedComboItems.filter(i => i.id !== id);
                    card.classList.remove('selected');
                } else {
                    if (window.app.selectedComboItems.length >= 4) {
                        alert("You can select exactly 4 items for this combo package!");
                        return;
                    }
                    window.app.selectedComboItems.push({ id, name });
                    card.classList.add('selected');
                }

                document.getElementById('buy-combo-btn').disabled = window.app.selectedComboItems.length !== 4;
            },

            checkoutCombo: () => {
                if (window.app.selectedComboItems.length !== 4) return;
                const itemIdsParam = window.app.selectedComboItems.map(i => i.id).join(',');
                window.location.href = `checkout.html?comboId=${window.app.activeComboData.id}&items=${encodeURIComponent(itemIdsParam)}`;
            },

            renderCategoryCircles: (categories) => {
                const container = document.getElementById('category-circles-container');
                container.innerHTML = categories.map(cat => `
                    <div class="category-circle-item" onclick="document.getElementById('block-${cat.id}').scrollIntoView({behavior: 'smooth'})">
                        <div class="category-circle">
                            <img src="${cat.image || 'https://placehold.co/200'}" alt="${cat.name}">
                        </div>
                        <span class="category-name">${cat.name}</span>
                    </div>
                `).join('');
            },

            renderCategorizedCatalogGrid: (sortedIds, operationalCategories) => {
                const blockContainer = document.getElementById('master-categories-block');
                let dynamicCatalogHTML = '';
                
                sortedIds.forEach(id => {
                    const categoryObject = operationalCategories.find(c => c.id === id);
                    if (!categoryObject || !categoryObject.products || Object.keys(categoryObject.products).length === 0) return;

                    const productsArray = Object.values(categoryObject.products);

                    dynamicCatalogHTML += `
                        <section class="section-spacer" id="block-${categoryObject.id}" style="padding-top: 40px; scroll-margin-top: 80px;">
                            <h2 class="section-title">${categoryObject.name}</h2>
                            <div class="product-grid">
                                ${productsArray.map(prod => `
                                    <div class="product-card" onclick="window.location.href='view.html?id=${prod.id}'">
                                        <div class="product-img-wrapper">
                                            <img src="${prod.image}" class="product-img" alt="${prod.name}">
                                        </div>
                                        <div class="product-info">
                                            <h4 class="product-card-title">${prod.name}</h4>
                                            <div class="product-card-price">
                                                <span>₹${prod.minPrice}</span>
                                                <div class="view-btn"><i class="fas fa-arrow-right"></i></div>
                                            </div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </section>
                    `;
                });

                blockContainer.innerHTML = dynamicCatalogHTML;
            },

            updateCartCount: () => {
                const cart = JSON.parse(localStorage.getItem('syncskill_cart')) || [];
                const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
                document.getElementById('cart-count').innerText = totalItems;
            }
        };

        window.app.init();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Detail | SyncSkill Pickles</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Serif:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
            background: #ffffff;
            color: #1a1a1a;
            line-height: 1.4;
        }

        .page-wrapper {
            padding: 28px 20px 48px 20px;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            gap: 48px;
            align-items: flex-start;
        }

        .gallery-col {
            flex: 1 1 480px;
            min-width: 0;
            display: flex;
            gap: 12px;
        }
        .gallery-col.sticky-active {
            position: sticky;
            top: 28px;
            align-self: flex-start;
        }

        .thumbnails-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            width: 76px;
            flex-shrink: 0;
        }
        .thumb-scroll-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid #ddd;
            background: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #333;
            transition: all 0.15s;
            flex-shrink: 0;
            z-index: 2;
        }
        .thumb-scroll-btn:hover {
            background: #f5f5f5;
            border-color: #E61D26;
            color: #E61D26;
        }
        .thumbnails {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 70px;
            height: 380px;
            overflow-y: auto;
            scroll-behavior: smooth;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .thumbnails::-webkit-scrollbar {
            display: none;
        }
        .thumb-item {
            width: 70px;
            aspect-ratio: 4/5;
            border-radius: 12px;
            border: 1px solid #e0e0e0;
            overflow: hidden;
            background: #f5f5f5;
            flex-shrink: 0;
            transition: border 0.15s;
            cursor: pointer;
        }
        .thumb-item.active {
            border: 2px solid #E61D26;
        }
        .thumb-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .main-image-wrapper {
            flex: 1;
            position: relative;
            background: #f8f2ec;
            border-radius: 18px;
            overflow: hidden;
            aspect-ratio: 4/5;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }
        .main-image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: opacity 0.3s ease;
        }
        .badge-best {
            position: absolute;
            top: 16px;
            left: 16px;
            background: #E61D26;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            letter-spacing: 0.3px;
        }
        .dots-container {
            display: none;
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.3);
            padding: 6px 14px;
            border-radius: 30px;
            gap: 8px;
            align-items: center;
            justify-content: center;
            z-index: 5;
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            transition: all 0.2s;
        }
        .dot.active {
            background: #E61D26;
            transform: scale(1.2);
        }

        .details-col {
            flex: 1 1 420px;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .product-title {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: #111;
            line-height: 1.3;
        }
        .rating-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }
        .stars {
            color: #E61D26;
            font-size: 16px;
            letter-spacing: 0.5px;
        }
        .review-count {
            color: #4a4a4a;
            border-bottom: 1px solid #ddd;
            padding-bottom: 1px;
        }

        .price-row {
            display: flex;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 10px 16px;
            margin: 4px 0 2px;
        }
        .current-price {
            font-size: 32px;
            font-weight: 700;
            color: #111;
        }
        .old-price {
            font-size: 20px;
            color: #9a9a9a;
            text-decoration: line-through;
        }
        .discount-badge {
            background: #ffe6e6;
            color: #E61D26;
            font-weight: 600;
            font-size: 15px;
            padding: 3px 14px;
            border-radius: 40px;
            border: 1px solid #f5c2c2;
        }
        .old-price.hidden,
        .discount-badge.hidden {
            display: none;
        }
        .tax-note {
            font-size: 14px;
            color: #4a4a4a;
        }
        .variant-header {
            font-weight: 600;
            font-size: 16px;
            margin: 6px 0 8px;
            color: #111;
        }

        .variant-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }
        .variant-box {
            border: 1px solid #e6e6e6;
            border-radius: 10px;
            padding: 8px 12px;
            background: white;
            cursor: pointer;
            transition: all 0.15s ease;
            flex: 1 0 auto;
            min-width: 70px;
            max-width: 160px;
        }
        .variant-box.active {
            border: 2px solid #E61D26;
            background: #fffbfb;
        }
        .variant-box:hover {
            border-color: #E61D26;
        }
        .variant-title {
            font-weight: 600;
            font-size: 14px;
            color: #111;
            white-space: nowrap;
        }
        .price-small {
            font-weight: 700;
            font-size: 14px;
            margin-top: 2px;
            white-space: nowrap;
        }
        .price-small .old {
            font-weight: 400;
            font-size: 12px;
            color: #888;
            text-decoration: line-through;
            margin-left: 4px;
        }
        .price-small .discount {
            font-weight: 600;
            font-size: 12px;
            color: #E61D26;
            margin-left: 4px;
        }

        .quantity-wrapper {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 4px 0;
        }
        .quantity-label {
            font-weight: 600;
            font-size: 16px;
            color: #111;
        }
        .quantity-control {
            display: flex;
            align-items: center;
            border: 1px solid #ddd;
            border-radius: 40px;
            overflow: hidden;
            background: white;
        }
        .qty-btn {
            width: 44px;
            height: 44px;
            border: none;
            background: white;
            font-size: 20px;
            font-weight: 600;
            color: #1a1a1a;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .qty-btn:hover {
            background: #f5f5f5;
        }
        .qty-btn.minus {
            border-right: 1px solid #eee;
        }
        .qty-btn.plus {
            border-left: 1px solid #eee;
        }
        .qty-value {
            width: 48px;
            text-align: center;
            font-weight: 600;
            font-size: 18px;
            padding: 0 4px;
            background: white;
            border: none;
            outline: none;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 4px;
        }
        .action-row {
            display: flex;
            gap: 12px;
        }
        .action-row .btn {
            flex: 1;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 16px;
            border-radius: 15px;
            font-weight: 500;
            font-size: 16px;
            font-family: 'IBM Plex Sans', sans-serif;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.2px;
        }
        .btn-cart {
            background: #1a1a1a;
            color: white;
        }
        .btn-cart:hover {
            background: #333;
            transform: translateY(-1px);
        }
        .btn-wishlist {
            background: #f5f5f5;
            color: #1a1a1a;
            border: 1px solid #ddd;
        }
        .btn-wishlist:hover {
            background: #fff0f0;
            border-color: #E61D26;
            color: #E61D26;
        }
        .btn-wishlist.active {
            background: #fff0f0;
            border-color: #E61D26;
            color: #E61D26;
        }
        .btn-wishlist.active i {
            animation: heartPop 0.35s ease;
        }
        @keyframes heartPop {
            0% { transform: scale(1); }
            40% { transform: scale(1.35); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); }
        }
        .btn-buynow {
            background: #E61D26;
            color: white;
            width: 100%;
            font-size: 17px;
            padding: 16px 20px;
            border-radius: 15px;
            box-shadow: 0 4px 14px rgba(230, 29, 38, 0.35);
        }
        .btn-buynow:hover {
            background: #c41820;
            transform: translateY(-2px);
        }
        .btn i {
            font-size: 18px;
        }
        .upi-icon {
            height: 22px;
            width: auto;
            max-width: 140px;
            object-fit: contain;
            vertical-align: middle;
            flex-shrink: 0;
        }

        .features-section {
            margin-top: 8px;
        }
        .feature-line {
            border: none;
            border-top: 1px solid #e0e0e0;
            margin: 14px 0;
        }
        .feature-items {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px 8px;
            text-align: center;
        }
        .feature-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #444;
            flex: 1 1 60px;
            min-width: 60px;
            max-width: 100px;
        }
        .feature-item i {
            font-size: 22px;
            color: #E61D26;
        }
        .feature-item span {
            font-weight: 500;
            line-height: 1.2;
        }

        .shipping-returns-section {
            margin-top: 0;
        }
        .sr-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            padding: 6px 0 14px;
            font-weight: 600;
            font-size: 16px;
            color: #111;
            user-select: none;
        }
        .sr-header .arrow-icon {
            transition: transform 0.3s;
            font-size: 14px;
            color: #555;
        }
        .sr-header.open .arrow-icon {
            transform: rotate(180deg);
        }
        .sr-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s ease, padding 0.35s ease;
            font-size: 14px;
            color: #333;
            line-height: 1.5;
        }
        .sr-content.open {
            max-height: 200px;
            padding-bottom: 8px;
        }
        .sr-content p {
            margin-bottom: 8px;
        }
        .sr-content p:last-child {
            margin-bottom: 0;
        }
        .shipping-returns-section .feature-line {
            margin-top: 6px;
            margin-bottom: 6px;
        }

        .description-section {
            margin-top: 4px;
        }
        .desc-heading {
            font-size: 17px;
            font-weight: 700;
            color: #111;
            margin-bottom: 10px;
        }
        .desc-body {
            font-size: 15px;
            color: #333;
            line-height: 1.7;
            max-height: 4.8em;
            overflow: hidden;
            transition: max-height 0.4s ease;
        }
        .desc-body.expanded {
            max-height: 600px;
        }
        .desc-toggle {
            display: inline-block;
            margin-top: 6px;
            background: none;
            border: none;
            padding: 0;
            font-family: 'IBM Plex Sans', sans-serif;
            font-size: 14px;
            font-weight: 600;
            color: #E61D26;
            cursor: pointer;
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        /* ================================================
           STICKY DOCK – now red background with white text
           ================================================ */
        .pickle-sticky-dock-wrapper {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%) translateY(140px);
            opacity: 0;
            pointer-events: none;
            z-index: 999;
            width: 600px;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
        }
        .pickle-sticky-dock-wrapper.dock-visible {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
            pointer-events: all;
        }

        .pickle-sticky-dock {
            background: #E61D26;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 48px rgba(0, 0, 0, 0.25);
            border-radius: 100px;
            padding: 8px 8px 8px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            color: #fff;
        }

        /* Price info */
        .dock-price-group {
            display: flex;
            flex-direction: column;
            line-height: 1;
            gap: 3px;
            flex-shrink: 0;
            min-width: 80px;
            color: #fff;
        }
        .dock-price-label {
            font-size: 10px;
            color: rgba(255,255,255,0.8);
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.05em;
        }
        .dock-price-val {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
        }
        .dock-price-strike {
            font-size: 12px;
            text-decoration: line-through;
            color: rgba(255,255,255,0.7);
            margin-left: 5px;
        }

        /* Size dropdown */
        .dock-size-wrapper {
            position: relative;
            flex-shrink: 0;
        }
        .dock-size-trigger {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 0 16px;
            height: 50px;
            border-radius: 50px;
            border: 1.5px solid rgba(255,255,255,0.6);
            background: transparent;
            font-family: 'IBM Plex Sans', sans-serif;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
            transition: border-color 0.15s, box-shadow 0.15s;
            white-space: nowrap;
            user-select: none;
        }
        .dock-size-trigger:hover,
        .dock-size-trigger.open {
            border-color: #fff;
            box-shadow: 0 0 0 3px rgba(255,255,255,0.2);
        }
        .dock-size-trigger .size-arrow {
            font-size: 12px;
            color: rgba(255,255,255,0.8);
            transition: transform 0.25s;
        }
        .dock-size-trigger.open .size-arrow {
            transform: rotate(180deg);
        }
        .dock-size-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.06em;
            color: rgba(255,255,255,0.7);
            text-transform: uppercase;
            margin-right: 2px;
        }
        .dock-selected-size {
            color: #fff;
            font-weight: 700;
        }

        .dock-size-dropdown {
            position: absolute;
            bottom: calc(100% + 10px);
            left: 0;
            background: #fff;
            border: 1px solid #e8e8e8;
            border-radius: 18px;
            box-shadow: 0 16px 40px rgba(0,0,0,0.14);
            overflow: hidden;
            width: 220px;
            z-index: 1000;
            opacity: 0;
            transform: translateY(8px) scale(0.97);
            pointer-events: none;
            transition: opacity 0.22s ease, transform 0.22s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .dock-size-dropdown.open {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: all;
        }
        .dock-size-option {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 13px 18px;
            cursor: pointer;
            transition: background 0.12s;
            border-bottom: 1px solid #f5f5f5;
            color: #111;
        }
        .dock-size-option:last-child {
            border-bottom: none;
        }
        .dock-size-option:hover {
            background: #fff5f5;
        }
        .dock-size-option.active {
            background: #fff0f0;
        }
        .dock-size-option .opt-name {
            font-weight: 600;
            font-size: 14px;
            color: #111;
        }
        .dock-size-option.active .opt-name {
            color: #E61D26;
        }
        .dock-size-option .opt-price-wrap {
            display: flex;
            align-items: baseline;
            gap: 5px;
            color: #111;
        }
        .dock-size-option .opt-price {
            font-weight: 700;
            font-size: 14px;
            color: #111;
        }
        .dock-size-option.active .opt-price {
            color: #E61D26;
        }
        .dock-size-option .opt-old {
            font-size: 11px;
            color: #bbb;
            text-decoration: line-through;
        }
        .dock-size-option .opt-disc {
            font-size: 11px;
            font-weight: 700;
            color: #E61D26;
            background: #ffe6e6;
            padding: 1px 6px;
            border-radius: 20px;
        }
        .dock-size-option .check-icon {
            font-size: 13px;
            color: #E61D26;
            margin-left: 6px;
            display: none;
        }
        .dock-size-option.active .check-icon {
            display: inline;
        }

        /* Dock buttons */
        .dock-cart-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 50px;
            padding: 0 22px;
            border-radius: 50px;
            background: #fff;
            color: #1a1a1a;
            font-family: 'IBM Plex Sans', sans-serif;
            font-size: 14px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            flex-shrink: 0;
            white-space: nowrap;
            transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
        }
        .dock-cart-btn:hover {
            background: #f0f0f0;
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(0,0,0,0.18);
        }
        .dock-buynow-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 50px;
            padding: 0 22px;
            border-radius: 50px;
            background: #fff;
            color: #E61D26;
            font-family: 'IBM Plex Sans', sans-serif;
            font-size: 14px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            flex: 1 1 0;
            min-width: 0;
            white-space: nowrap;
            transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 14px rgba(230,29,38,0.3);
        }
        .dock-buynow-btn:hover {
            background: #f0f0f0;
            transform: translateY(-1px);
            box-shadow: 0 8px 22px rgba(230,29,38,0.4);
        }

        /* Tooltip on dock */
        .dock-no-size-tip {
            position: absolute;
            bottom: calc(100% + 10px);
            left: 50%;
            transform: translateX(-50%) scale(0.95);
            background: #1a1a1a;
            color: #fff;
            font-size: 12px;
            font-weight: 500;
            padding: 7px 14px;
            border-radius: 8px;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s, transform 0.2s;
            z-index: 1001;
        }
        .dock-no-size-tip.show {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }
        .dock-no-size-tip::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border: 5px solid transparent;
            border-top-color: #1a1a1a;
        }

        /* "You may also like" section */
        .also-like-section {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 20px 48px;
            display: none;
        }
        .also-like-line {
            border: none;
            border-top: 1px solid #e0e0e0;
            margin: 36px 0 28px;
        }
        .also-like-heading {
            font-size: 22px;
            font-weight: 700;
            color: #111;
            margin-bottom: 20px;
            letter-spacing: -0.2px;
        }
        .also-like-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }
        .al-card {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s;
        }
        .al-card:hover {
            transform: translateY(-4px);
        }
        .al-image-wrapper {
            position: relative;
            background: #f8f2ec;
            aspect-ratio: 4/5;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }
        .al-image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 12px;
        }
        .al-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 20px;
            z-index: 2;
        }
        .al-badge-bestseller {
            background: #ffe6e6;
            color: #E61D26;
            border: 1px solid #f5c2c2;
        }

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Replace with your actual credentials
        const firebaseConfig = {
            apiKey: "AIzaSyCZbCr-Zt5KQblRQ8Pk58KuinCVP-TlXGo",
            authDomain: "happynonvegpickles-f2636.firebaseapp.com",
            projectId: "happynonvegpickles-f2636",
            storageBucket: "happynonvegpickles-f2636.firebasestorage.app",
            messagingSenderId: "802823212924",
            appId: "1:802823212924:web:d82c92737ffa950798def9"
        };
        const db = getFirestore(initializeApp(firebaseConfig));

        window.productData = null;
        window.activeComboId = null;
        window.thumbImages = [];

        async function init() {
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');

            if (!productId) { window.location.href = 'index.html'; return; }

            try {
                // 1. Fetch Product
                const productRef = doc(db, 'products', productId);
                const snap = await getDoc(productRef);

                if (!snap.exists() || snap.data().isavailable === false) {
                    document.getElementById('productContainer').innerHTML = `
                        <div style="text-align:center; padding: 100px 20px; width: 100%;">
                            <h2>Product Unavailable</h2>
                            <p style="margin: 16px 0;">We could not find this product.</p>
                            <a href="index.html" style="color:#E61D26; font-weight:600;">Return to Home</a>
                        </div>`;
                    return;
                }

                window.productData = { id: snap.id, ...snap.data() };
                
                // Construct images array
                window.thumbImages = [window.productData.image];
                if (window.productData.additionalImages && window.productData.additionalImages.length > 0) {
                    window.thumbImages.push(...window.productData.additionalImages.filter(img => img.trim() !== ''));
                }

                // 2. Fetch Category for "You may also like"
                const catId = window.productData.categoryId;
                const catPromise = catId ? getDoc(doc(db, 'categories', catId)) : Promise.resolve(null);
                
                // 3. Fetch Combo
                const combosPromise = getDocs(collection(db, 'combos'));

                const [catSnap, combosSnap] = await Promise.all([catPromise, combosPromise]);

                // Render main product
                renderProduct();

                // Render You May Also Like
                if (catSnap && catSnap.exists() && catSnap.data().products) {
                    renderAlsoLike(catSnap.data().products, productId);
                }

                // Render Combo
                const activeCombo = combosSnap.docs.map(d => ({id: d.id, ...d.data()})).find(c => c.isActive === true);
                if (activeCombo) {
                    window.activeComboId = activeCombo.id;
                    renderCombo(activeCombo);
                }

                // Attach all UI event listeners (replacing the original IIFE)
                initUI();

            } catch (error) {
                console.error("Error:", error);
            }
        }

        function renderProduct() {
            const p = window.productData;
            const container = document.getElementById('productContainer');

            let thumbsHtml = window.thumbImages.map((img, idx) => `
                <div class="thumb-item ${idx===0?'active':''}" data-index="${idx}">
                    <img src="${img}" alt="View">
                </div>
            `).join('');
            
            let dotsHtml = window.thumbImages.map((img, idx) => `
                <span class="dot ${idx===0?'active':''}"></span>
            `).join('');

            let variantsHtml = '';
            let dropdownHtml = '';
            
            if (p.variants) {
                variantsHtml = p.variants.map((v, idx) => {
                    const hasDiscount = v.mrp && v.mrp > v.price;
                    const discPercent = hasDiscount ? Math.round(((v.mrp - v.price)/v.mrp)*100) : 0;
                    return `
                    <div class="variant-box ${idx === 0 ? 'active' : ''}" data-price="${v.price}" data-old="${v.mrp||v.price}" data-discount="${discPercent}" data-size="${v.weight}">
                        <div class="variant-title">${v.weight}</div>
                        <div class="price-small">&#8377;${v.price} ${hasDiscount ? `<span class="old">&#8377;${v.mrp}</span> <span class="discount">${discPercent}%</span>` : ''}</div>
                    </div>
                    `;
                }).join('');

                dropdownHtml = p.variants.map((v, idx) => {
                    const hasDiscount = v.mrp && v.mrp > v.price;
                    const discPercent = hasDiscount ? Math.round(((v.mrp - v.price)/v.mrp)*100) : 0;
                    return `
                    <div class="dock-size-option ${idx === 0 ? 'active' : ''}" role="option" data-price="${v.price}" data-old="${v.mrp||v.price}" data-discount="${discPercent}" data-size="${v.weight}">
                        <span class="opt-name">${v.weight}</span>
                        <div class="opt-price-wrap">
                            <span class="opt-price">&#8377;${v.price}</span>
                            ${hasDiscount ? `<span class="opt-old">&#8377;${v.mrp}</span><span class="opt-disc">${discPercent}% off</span>` : ''}
                            <i class="fas fa-check check-icon"></i>
                        </div>
                    </div>
                    `;
                }).join('');
            }

            container.innerHTML = `
                <div class="gallery-col" id="galleryCol">
                    <div class="thumbnails-wrapper">
                        <button class="thumb-scroll-btn" id="thumbUp"><i class="fas fa-chevron-up"></i></button>
                        <div class="thumbnails" id="thumbnailsContainer">
                            ${thumbsHtml}
                        </div>
                        <button class="thumb-scroll-btn" id="thumbDown"><i class="fas fa-chevron-down"></i></button>
                    </div>
                    <div class="main-image-wrapper" id="mainImageWrapper">
                        <img id="mainImage" src="${window.thumbImages[0]}" alt="${p.name}">
                        ${p.isavailable ? '<div class="badge-best">Best Seller</div>' : ''}
                        <div class="dots-container" id="dotsContainer" ${window.thumbImages.length > 1 ? 'style="display:flex;"' : ''}>
                            ${dotsHtml}
                        </div>
                    </div>
                </div>

                <div class="details-col">
                    <h1 class="product-title">${p.longName || p.name}</h1>
                    <div class="rating-row">
                        <span class="stars"><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star-half-stroke"></i></span>
                        <span class="review-count">Authentic Taste</span>
                    </div>
                    <div class="price-row">
                        <span class="current-price" id="currentPrice">&#8377;0</span>
                        <span class="old-price hidden" id="oldPrice"></span>
                        <span class="discount-badge hidden" id="discountBadge"></span>
                    </div>
                    <div class="tax-note">MRP Inclusive of All Taxes.</div>

                    <div class="variant-header">Select Size</div>
                    <div class="variant-grid" id="variantGrid">
                        ${variantsHtml}
                    </div>

                    <div class="quantity-wrapper">
                        <span class="quantity-label">Quantity</span>
                        <div class="quantity-control">
                            <button class="qty-btn minus" id="qtyMinus"><i class="fas fa-minus"></i></button>
                            <input type="text" class="qty-value" id="qtyValue" value="1" readonly>
                            <button class="qty-btn plus" id="qtyPlus"><i class="fas fa-plus"></i></button>
                        </div>
                    </div>

                    <div class="action-buttons" id="mainActionButtons">
                        <div class="action-row">
                            <button class="btn btn-cart" id="mainCartBtn"><i class="fas fa-shopping-cart"></i> Add to Cart</button>
                            <button class="btn btn-wishlist" id="wishlistBtn"><i class="fas fa-heart"></i> Wishlist</button>
                        </div>
                        <button class="btn btn-buynow" id="heroBuyNow">
                            <img src="https://fastrr-boost-ui.pickrr.com/assets/images/boost_button/upi_options.svg" alt="UPI Options" class="upi-icon">
                            Buy Now
                        </button>

                        <div class="features-section">
                            <hr class="feature-line">
                            <div class="feature-items">
                                <div class="feature-item"><i class="fas fa-gem"></i><span>Premium Quality</span></div>
                                <div class="feature-item"><i class="fas fa-circle-check"></i><span>No Preservatives</span></div>
                                <div class="feature-item"><i class="fas fa-truck-fast"></i><span>Fast Delivery</span></div>
                                <div class="feature-item"><i class="fas fa-mortar-pestle"></i><span>Traditional Recipe</span></div>
                                <div class="feature-item"><i class="fas fa-shield-halved"></i><span>Secure Packaging</span></div>
                            </div>
                            <hr class="feature-line">
                        </div>

                        <div class="shipping-returns-section">
                            <div class="sr-header" id="shippingReturnsToggle">
                                <span>Shipping &amp; Returns</span>
                                <i class="fas fa-chevron-down arrow-icon"></i>
                            </div>
                            <div class="sr-content" id="shippingReturnsContent">
                                <p><strong>Shipping:</strong> Free standard shipping on all orders over &#8377;999. Orders processed within 24&#8211;48 hours.</p>
                                <p><strong>Returns:</strong> Returns accepted within 7 days of delivery for original, unopened items.</p>
                            </div>
                            <hr class="feature-line">
                        </div>

                        <div class="description-section">
                            <div class="desc-heading">Description</div>
                            <div class="desc-body" id="descBody">
                                ${p.description ? p.description.replace(/\n/g, '<br>') : 'Authentic homemade style pickle.'}
                            </div>
                            <button class="desc-toggle" id="descToggle">View more</button>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('dockSizeDropdown').innerHTML = dropdownHtml;
        }

        function renderAlsoLike(categoryProductsMap, currentProductId) {
            const relatedProds = Object.values(categoryProductsMap)
                .filter(p => p.id !== currentProductId && p.isavailable !== false)
                .slice(0, 4);

            if (relatedProds.length === 0) return;

            const grid = document.getElementById('alsoLikeGrid');
            grid.innerHTML = relatedProds.map(prod => `
                <a href="view.html?id=${prod.id}" class="al-card" style="text-decoration:none; color:inherit;">
                    <div class="al-image-wrapper">
                        <span class="al-badge al-badge-bestseller">Recommended</span>
                        <img src="${prod.image}" alt="${prod.name}">
                    </div>
                    <div class="al-body">
                        <div class="al-rating"><i class="fas fa-star"></i> Authentic</div>
                        <div class="al-title">${prod.name}</div>
                        <div class="al-price">&#8377;${prod.minPrice} - &#8377;${prod.maxPrice}</div>
                        <button class="al-btn" onclick="event.preventDefault(); window.location.href='view.html?id=${prod.id}'"><i class="fas fa-shopping-cart"></i> View Product</button>
                    </div>
                </a>
            `).join('');

            document.getElementById('alsoLikeSection').style.display = 'block';
        }

        function renderCombo(combo) {
            const grid = document.getElementById('pickleGridPremium');
            grid.innerHTML = (combo.items || []).map(item => `
                <div class="pickle-item-premium" data-pickle="${item.id}" data-name="${item.name.replace(/'/g,"\\'")}">
                    <div class="pickle-image-plate"><img src="${item.image}" alt="${item.name}"></div>
                    <span class="pickle-name-premium">${item.name}</span>
                    <div class="pickle-check-premium"><i class="fas fa-check"></i></div>
                </div>
            `).join('');

            document.getElementById('comboSection').style.display = 'block';
        }

        function addToCartHandler(redirect = false) {
            const activeBox = document.querySelector('.variant-box.active');
            if (!activeBox) return;

            const item = {
                productId: window.productData.id,
                name: window.productData.name,
                image: window.productData.image,
                weight: activeBox.dataset.size,
                price: parseFloat(activeBox.dataset.price),
                quantity: parseInt(document.getElementById('qtyValue').value, 10)
            };

            let cart = JSON.parse(localStorage.getItem('syncskill_cart')) || [];
            const idx = cart.findIndex(c => c.productId === item.productId && c.weight === item.weight);
            if (idx > -1) cart[idx].quantity += item.quantity;
            else cart.push(item);
            
            localStorage.setItem('syncskill_cart', JSON.stringify(cart));
            
            if (redirect) {
                window.location.href = 'checkout.html';
            } else {
                showComboToast(`🛒 ${item.weight} added to cart!`, '🛒');
            }
        }

        function showComboToast(msg, icon) {
            const toast = document.getElementById('toastPremium');
            const toastMsgEl = document.getElementById('toastMessage');
            document.querySelector('.toast-icon').textContent = icon || '✨';
            toastMsgEl.textContent = msg;
            toast.classList.add('show');
            setTimeout(function () { toast.classList.remove('show'); }, 2500);
        }

        function initUI() {
            var STICKY_BREAKPOINT = 768;

            /* Gallery sticky */
            var galleryCol = document.getElementById('galleryCol');
            function syncStickyGallery() {
                if (window.innerWidth >= STICKY_BREAKPOINT) {
                    galleryCol.classList.add('sticky-active');
                } else {
                    galleryCol.classList.remove('sticky-active');
                }
            }
            syncStickyGallery();
            window.addEventListener('resize', syncStickyGallery);

            /* Variant boxes */
            var variantBoxes    = document.querySelectorAll('.variant-box');
            var currentPriceEl  = document.getElementById('currentPrice');
            var oldPriceEl      = document.getElementById('oldPrice');
            var discountBadgeEl = document.getElementById('discountBadge');
            var stickyBar       = document.getElementById('stickyBuyBar');
            var stickyPriceEl   = document.getElementById('stickyPrice');

            function formatPrice(val) {
                return parseInt(val, 10).toLocaleString('en-IN');
            }

            var dockPriceVal    = document.getElementById('dockPriceVal');
            var dockPriceStrike = document.getElementById('dockPriceStrike');
            var dockSelectedLabel = document.getElementById('dockSelectedLabel');
            var dockSelectedSize = null;

            function updateDockFromVariant(box) {
                if (!box) {
                    dockPriceVal.textContent    = '\u20B90';
                    dockPriceStrike.textContent = '';
                    dockSelectedLabel.textContent = 'Select';
                    dockSelectedSize = null;
                    document.querySelectorAll('.dock-size-option').forEach(function(o){ o.classList.remove('active'); });
                    return;
                }
                var price    = box.dataset.price;
                var old      = box.dataset.old;
                var sizeLabel = box.dataset.size || box.querySelector('.variant-title').textContent;
                dockPriceVal.textContent    = '\u20B9' + formatPrice(price);
                dockPriceStrike.textContent = (old && old > price) ? '\u20B9' + formatPrice(old) : '';
                dockSelectedLabel.textContent = sizeLabel;
                dockSelectedSize = sizeLabel;
                document.querySelectorAll('.dock-size-option').forEach(function(opt) {
                    opt.classList.toggle('active', opt.dataset.size === sizeLabel);
                });
            }

            function updatePriceDisplay() {
                var activeBox = document.querySelector('.variant-box.active');
                if (activeBox) {
                    var priceText = '\u20B9' + formatPrice(activeBox.dataset.price) + '.00';
                    currentPriceEl.textContent = priceText;
                    
                    if(activeBox.dataset.old && parseInt(activeBox.dataset.old) > parseInt(activeBox.dataset.price)) {
                        oldPriceEl.textContent      = '\u20B9' + formatPrice(activeBox.dataset.old) + '.00';
                        discountBadgeEl.textContent = 'Save ' + activeBox.dataset.discount + '%';
                        oldPriceEl.classList.remove('hidden');
                        discountBadgeEl.classList.remove('hidden');
                    } else {
                        oldPriceEl.classList.add('hidden');
                        discountBadgeEl.classList.add('hidden');
                    }
                    
                    stickyPriceEl.textContent = priceText;
                    if (window.innerWidth < STICKY_BREAKPOINT) { stickyBar.classList.add('visible'); }
                    updateDockFromVariant(activeBox);
                }
            }

            variantBoxes.forEach(function (box) {
                box.addEventListener('click', function () {
                    variantBoxes.forEach(function (b) { b.classList.remove('active'); });
                    this.classList.add('active');
                    updatePriceDisplay();
                });
            });

            // Initialize price
            updatePriceDisplay();

            /* Quantity */
            var qtyValue = document.getElementById('qtyValue');
            document.getElementById('qtyMinus').addEventListener('click', function () {
                qtyValue.value = Math.max(1, parseInt(qtyValue.value, 10) - 1);
            });
            document.getElementById('qtyPlus').addEventListener('click', function () {
                qtyValue.value = Math.min(99, parseInt(qtyValue.value, 10) + 1);
            });

            /* Wishlist */
            var wishlistBtn = document.getElementById('wishlistBtn');
            wishlistBtn.addEventListener('click', function () {
                this.classList.toggle('active');
                var on = this.classList.contains('active');
                this.innerHTML = on ?
                    '<i class="fas fa-heart"></i> Wishlisted' :
                    '<i class="fas fa-heart"></i> Wishlist';
            });

            /* Add to Cart Actions (Main Product) */
            document.getElementById('mainCartBtn').addEventListener('click', function() { addToCartHandler(false); });
            document.getElementById('heroBuyNow').addEventListener('click', function() { addToCartHandler(true); });
            document.getElementById('stickyCartBtn').addEventListener('click', function() { addToCartHandler(false); });
            document.getElementById('stickyBuyBtn').addEventListener('click', function() { addToCartHandler(true); });
            document.getElementById('dockCartBtn').addEventListener('click', function() { addToCartHandler(false); });
            document.getElementById('dockBuyNowBtn').addEventListener('click', function() { addToCartHandler(true); });

            /* Gallery thumbnails & swipe */
            var thumbItems     = document.querySelectorAll('.thumb-item');
            var mainImage      = document.getElementById('mainImage');
            var thumbContainer = document.getElementById('thumbnailsContainer');
            var dots           = document.querySelectorAll('.dot');
            
            var currentIndex       = 0;
            var autoRotateInterval = null;
            var touchStartX        = 0;

            function setActiveThumb(index) {
                if(window.thumbImages.length === 0) return;
                currentIndex = (index + window.thumbImages.length) % window.thumbImages.length;
                thumbItems.forEach(function (item, i) { item.classList.toggle('active', i === currentIndex); });
                mainImage.src = window.thumbImages[currentIndex];
                dots.forEach(function (dot, i) { dot.classList.toggle('active', i === currentIndex); });
                if(thumbContainer) thumbContainer.scrollTo({ top: currentIndex * 80, behavior: 'smooth' });
            }

            thumbItems.forEach(function (item) {
                item.addEventListener('click', function () { setActiveThumb(parseInt(this.dataset.index)); });
            });
            if(document.getElementById('thumbUp')) document.getElementById('thumbUp').addEventListener('click', function () { setActiveThumb(currentIndex - 1); });
            if(document.getElementById('thumbDown')) document.getElementById('thumbDown').addEventListener('click', function () { setActiveThumb(currentIndex + 1); });

            var mainWrapper = document.getElementById('mainImageWrapper');
            mainWrapper.addEventListener('touchstart', function (e) {
                touchStartX = e.changedTouches[0].screenX;
                stopAutoRotate();
            }, { passive: true });
            mainWrapper.addEventListener('touchend', function (e) {
                var diff = touchStartX - e.changedTouches[0].screenX;
                if (Math.abs(diff) > 50) { setActiveThumb(diff > 0 ? currentIndex + 1 : currentIndex - 1); }
                if (window.innerWidth < STICKY_BREAKPOINT) { startAutoRotate(); }
            }, { passive: true });

            function startAutoRotate() {
                if (window.innerWidth < STICKY_BREAKPOINT) {
                    stopAutoRotate();
                    autoRotateInterval = setInterval(function () { setActiveThumb(currentIndex + 1); }, 5000);
                }
            }
            function stopAutoRotate() {
                if (autoRotateInterval) { clearInterval(autoRotateInterval); autoRotateInterval = null; }
            }

            setActiveThumb(0);
            startAutoRotate();

            window.addEventListener('resize', function () {
                if (window.innerWidth >= STICKY_BREAKPOINT) {
                    stopAutoRotate();
                } else {
                    startAutoRotate();
                }
                handleDockVisibility();
            });

            /* Old mobile sticky bar scroll */
            window.addEventListener('scroll', function () {
                if (window.innerWidth >= STICKY_BREAKPOINT) return;
                var buyBtns = document.querySelector('.action-buttons');
                if (!buyBtns) return;
                var rect = buyBtns.getBoundingClientRect();
                if (rect.top < window.innerHeight && rect.bottom > 0) {
                    stickyBar.classList.remove('visible');
                } else if (document.querySelector('.variant-box.active')) {
                    stickyBar.classList.add('visible');
                }
            });

            /* Shipping & description toggles */
            document.getElementById('shippingReturnsToggle').addEventListener('click', function () {
                this.classList.toggle('open');
                document.getElementById('shippingReturnsContent').classList.toggle('open');
            });

            var descBody   = document.getElementById('descBody');
            var descToggle = document.getElementById('descToggle');
            descToggle.addEventListener('click', function () {
                var expanded = descBody.classList.toggle('expanded');
                this.textContent = expanded ? 'View less' : 'View more';
            });

            /* Sticky dock logic */
            var pickleSticky      = document.getElementById('pickleSticky');
            var heroBuyNow        = document.getElementById('heroBuyNow');
            var dockSizeTrigger   = document.getElementById('dockSizeTrigger');
            var dockSizeDropdown  = document.getElementById('dockSizeDropdown');
            var dockNoSizeTip     = document.getElementById('dockNoSizeTip');
            var tipTimeout        = null;

            function openDropdown() {
                dockSizeDropdown.classList.add('open');
                dockSizeTrigger.classList.add('open');
                dockSizeTrigger.setAttribute('aria-expanded', 'true');
            }
            function closeDropdown() {
                dockSizeDropdown.classList.remove('open');
                dockSizeTrigger.classList.remove('open');
                dockSizeTrigger.setAttribute('aria-expanded', 'false');
            }

            dockSizeTrigger.addEventListener('click', function (e) {
                e.stopPropagation();
                if (dockSizeDropdown.classList.contains('open')) {
                    closeDropdown();
                } else {
                    openDropdown();
                }
            });

            document.querySelectorAll('.dock-size-option').forEach(function (opt) {
                opt.addEventListener('click', function (e) {
                    e.stopPropagation();
                    var price    = this.dataset.price;
                    var old      = this.dataset.old;
                    var sizeLabel = this.dataset.size;
                    document.querySelectorAll('.dock-size-option').forEach(function(o){ o.classList.remove('active'); });
                    this.classList.add('active');
                    dockPriceVal.textContent      = '\u20B9' + formatPrice(price);
                    dockPriceStrike.textContent   = (old && old > price) ? '\u20B9' + formatPrice(old) : '';
                    dockSelectedLabel.textContent = sizeLabel;
                    dockSelectedSize = sizeLabel;
                    variantBoxes.forEach(function(box){
                        box.classList.toggle('active', box.dataset.size === sizeLabel);
                    });
                    updatePriceDisplay();
                    closeDropdown();
                });
            });

            document.addEventListener('click', function (e) {
                if (!document.getElementById('dockSizeWrapper').contains(e.target)) {
                    closeDropdown();
                }
            });

            dockSizeTrigger.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    if (dockSizeDropdown.classList.contains('open')) {
                        closeDropdown();
                    } else {
                        openDropdown();
                    }
                }
                if (e.key === 'Escape') {
                    closeDropdown();
                }
            });

            function showNoSizeTip() {
                if (tipTimeout) { clearTimeout(tipTimeout); }
                dockNoSizeTip.classList.add('show');
                tipTimeout = setTimeout(function () { dockNoSizeTip.classList.remove('show'); }, 2200);
                openDropdown();
            }

            function handleDockVisibility() {
                var rect = heroBuyNow.getBoundingClientRect();
                if (rect.bottom < 0) {
                    pickleSticky.classList.add('dock-visible');
                } else {
                    pickleSticky.classList.remove('dock-visible');
                    closeDropdown();
                }
            }
            window.addEventListener('scroll', handleDockVisibility, { passive: true });
            handleDockVisibility();

            /* Combo section logic */
            var comboItems   = document.querySelectorAll('.pickle-item-premium');
            if(comboItems.length > 0) {
                var ringCount    = document.getElementById('ringCount');
                var ringFill     = document.getElementById('ringFill');
                var countDisplay = document.getElementById('countDisplay');
                var progressMsg  = document.getElementById('progressMsg');
                var hiddenButtons = document.getElementById('hiddenButtons');
                var viewMoreBtn  = document.getElementById('viewMoreBtn');
                var addToCartBtn = document.getElementById('addToCartBtn');
                var buyNowBtn    = document.getElementById('buyNowBtn');
                var MAX          = 4;
                var CIRCUMFERENCE = 2 * Math.PI * 20;
                var selected      = new Set();

                function updateComboUI() {
                    var count = selected.size;
                    ringCount.textContent = count;
                    ringFill.style.strokeDashoffset = CIRCUMFERENCE * (1 - count / MAX);
                    ringCount.classList.toggle('complete', count === MAX);
                    ringFill.classList.toggle('complete', count === MAX);
                    countDisplay.textContent = count;

                    if (count === 0) {
                        progressMsg.innerHTML = 'Select <strong>4</strong> pickles to unlock';
                    } else if (count < MAX) {
                        progressMsg.innerHTML = '<span class="highlight-red">' + count +
                            '</span> of <strong>4</strong> selected \u2014 pick <span class="highlight-red">' + (MAX - count) + '</span> more';
                    } else {
                        progressMsg.innerHTML = '\u2705 <strong>Ready!</strong> All 4 pickles selected!';
                    }

                    if (count > 0) {
                        viewMoreBtn.classList.add('hidden-btn');
                        hiddenButtons.classList.add('show');
                    } else {
                        viewMoreBtn.classList.remove('hidden-btn');
                        hiddenButtons.classList.remove('show');
                    }

                    comboItems.forEach(function (item) {
                        item.classList.toggle('locked-out', count >= MAX && !selected.has(item.dataset.pickle));
                    });

                    addToCartBtn.disabled = count !== MAX;
                    buyNowBtn.disabled    = count !== MAX;
                }

                comboItems.forEach(function (item) {
                    item.addEventListener('click', function () {
                        var key = this.dataset.pickle;
                        if (selected.has(key)) {
                            selected.delete(key);
                            this.classList.remove('selected');
                        } else {
                            if (selected.size >= MAX) {
                                showComboToast('You can only select 4 pickles!', '\u26a0\ufe0f');
                                return;
                            }
                            selected.add(key);
                            this.classList.add('selected');
                        }
                        updateComboUI();
                    });
                });

                viewMoreBtn.addEventListener('click', function (e) {
                    e.preventDefault();
                    window.location.href = '#';
                });

                addToCartBtn.addEventListener('click', function () {
                    if (selected.size !== MAX) { return; }
                    var names = [];
                    comboItems.forEach(function (item) {
                        if (selected.has(item.dataset.pickle)) {
                            names.push(item.dataset.name);
                        }
                    });
                    showComboToast(names.join(', ') + ' combo added to cart!', '\ud83d\uded2');
                });

                buyNowBtn.addEventListener('click', function () {
                    if (selected.size !== MAX) { return; }
                    const itemIdsArray = Array.from(selected);
                    window.location.href = `checkout.html?comboId=${window.activeComboId}&items=${encodeURIComponent(itemIdsArray.join(','))}`;
                });

                updateComboUI();
            }
        }

        // Boot
        init();
    </script>
</body>
</html>
